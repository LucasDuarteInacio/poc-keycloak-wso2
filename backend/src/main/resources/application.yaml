spring:
  application:
    name: OrderProcessingManagement
  datasource:
    url: jdbc:postgresql://localhost:5432/order_processing_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  servlet:
    context-path: /api

# Validação de gateway WSO2
# O WSO2 deve injetar o header configurado em "header-name" com o valor de "secret"
# via mediation policy (In Sequence) no Publisher. Ver docs/SETUP-KEYCLOAK-WSO2-SSO.md
wso2:
  gateway:
    validation:
      enabled: false
      header-name: X-Gateway-Secret
      secret: ${GATEWAY_SECRET:change-this-in-production-use-env-var}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true