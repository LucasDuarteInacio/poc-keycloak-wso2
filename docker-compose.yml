services:
  # Samba 4 como AD DC (laboratório). Keycloak: ldap://samba-ad:389, vendor Active Directory,
  # Bind DN CN=Administrator,CN=Users,DC=lab,DC=order,DC=local, Users DN CN=Users,DC=lab,DC=order,DC=local.
  # INSECURELDAP=true só para dev (LDAP simples). Primeira subida provisiona o domínio (pode levar 1–2 min).
  # Em Mac Apple Silicon a imagem é amd64; platform abaixo evita o warning e força emulação (pode ser mais lento).
  samba-ad:
    image: nowsci/samba-domain:latest
    platform: linux/amd64
    container_name: order_processing_samba_ad
    hostname: dc1
    privileged: true
    environment:
      DOMAIN: LAB.ORDER.LOCAL
      DOMAINPASS: "${SAMBA_DOMAIN_PASSWORD:-LabAdmin!ChangeMe}"
      DOMAIN_DC: dc=lab,dc=order,dc=local
      DOMAIN_EMAIL: order.local
      NOCOMPLEXITY: "true"
      INSECURELDAP: "true"
      DNSFORWARDER: 8.8.8.8
      JOIN: "false"
    volumes:
      - samba_ad_data:/var/lib/samba
      - samba_ad_config:/etc/samba/external
    ports:
      - "1389:389"
      - "1636:636"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://127.0.0.1 -b '' -s base '(objectClass=*)' namingContexts >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  postgres:
    image: postgres:15-alpine
    container_name: order_processing_postgres
    environment:
      POSTGRES_DB: order_processing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    container_name: order_processing_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/order_processing_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Hostname v2: URLs em http:// evitam impor HTTPS; use http://localhost:8081 no browser (porta publicada).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  # Aplica sslRequired=NONE em master e order-processing (HTTP em dev). O realm master não vem do JSON;
  # sem isto /admin/ pode mostrar "HTTPS required" mesmo em http://localhost:8081.
  keycloak-ssl-init:
    image: quay.io/keycloak/keycloak:25.0.4
    container_name: order_processing_keycloak_ssl_init
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        echo "keycloak-ssl-init: aguardando Admin CLI (a imagem Keycloak 25 não inclui curl)..."
        ok=0
        for i in $$(seq 1 90); do
          if /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://127.0.0.1:8080 --realm master \
            --user "$$KEYCLOAK_ADMIN" --password "$$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null; then
            echo "keycloak-ssl-init: login admin OK (tentativa $$i)"
            ok=1
            break
          fi
          sleep 2
        done
        if [ "$$ok" -ne 1 ]; then
          echo "keycloak-ssl-init: ERRO — login admin não funcionou a tempo (Keycloak ainda a migrar a BD?)."
          exit 1
        fi
        sleep 3
        master_ok=0
        for attempt in 1 2 3; do
          if /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE; then
            master_ok=1
            break
          fi
          sleep 5
        done
        if [ "$$master_ok" -ne 1 ]; then
          echo "keycloak-ssl-init: ERRO — update realms/master (sslRequired) falhou."
          exit 1
        fi
        if /opt/keycloak/bin/kcadm.sh get realms/order-processing >/dev/null 2>&1; then
          op_ok=0
          for attempt in 1 2 3; do
            if /opt/keycloak/bin/kcadm.sh update realms/order-processing -s sslRequired=NONE; then
              op_ok=1
              break
            fi
            sleep 5
          done
          if [ "$$op_ok" -ne 1 ]; then
            echo "keycloak-ssl-init: ERRO — update realms/order-processing (sslRequired) falhou."
            exit 1
          fi
        fi
        echo "keycloak-ssl-init: sslRequired=NONE aplicado (master e order-processing se existir)."
    restart: "no"

  wso2am:
    image: wso2/wso2am:4.5.0
    container_name: order_processing_wso2
    user: root
    ports:
      - "9443:9443"
      - "8243:8243"
      - "8280:8280"
      - "9763:9763"
    volumes:
      - wso2_data:/home/wso2carbon/wso2am-4.5.0/repository
      - ./config-wso2.toml:/home/wso2carbon/wso2am-4.5.0/repository/conf/deployment.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:9443/publisher || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  postgres_data:
  wso2_data:
  samba_ad_data:
  samba_ad_config: